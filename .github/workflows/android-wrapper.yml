name: Android wrapper

on:
  workflow_dispatch:
  push:
    paths:
      - packages/android/**
      - packages/app/**
      - packages/ui/**
      - packages/session-ui/**
      - packages/gui-plugins/**
      - bun.lock
      - .github/workflows/android-wrapper.yml
  pull_request:
    paths:
      - packages/android/**
      - packages/app/**
      - packages/ui/**
      - packages/session-ui/**
      - packages/gui-plugins/**
      - bun.lock
      - .github/workflows/android-wrapper.yml

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/android
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install web app dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Test notification relay and registration importer
        run: python3 -m unittest discover -s notifications -v
      # GitHub's Ubuntu runner includes JDK 17 and the Android SDK.
      - name: Test and build APK
        run: JAVA_HOME="$JAVA_HOME_17_X64" ./gradlew --no-daemon testDebugUnitTest lintDebug verifyBundledAssets
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-remote-debug
          path: packages/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-reports
          path: packages/android/app/build/reports/
